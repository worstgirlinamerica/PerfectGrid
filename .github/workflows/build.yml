name: Build Perfect Grid

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "dist_windows\Perfect Grid\*" -DestinationPath "Perfect-Grid-Windows.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-Windows
          path: Perfect-Grid-Windows.zip

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build macOS app
        run: ./scripts/build_macos.sh
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "dist_mac/Perfect Grid.app" "Perfect-Grid-macOS.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-macOS
          path: Perfect-Grid-macOS.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libxcb-xinerama0 libxcb-cursor0 \
            libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: pip install -r requirements.txt arabic-reshaper python-bidi
      - name: Build Linux app
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
      - name: Package Linux app
        run: tar -czf Perfect-Grid-Linux.tar.gz -C dist_linux perfect-grid
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-Linux
          path: Perfect-Grid-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
