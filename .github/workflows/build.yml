name: Build Perfect Grid

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Write build version from tag
        shell: pwsh
        run: |
          # Bakes the exact tag being built into the app so the in-app
          # version tag can't drift from it the way APP_VERSION in app.py
          # did for v0.2.2 (that constant didn't get bumped before
          # tagging, so the shipped build showed "v0.2.1"). Only writes
          # this on an actual "vX.Y.Z" tag push — a workflow_dispatch run
          # off a branch has no such tag, so app.py's APP_VERSION fallback
          # (plus dev commit-hash suffix) is used instead, same as always.
          if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+.*)$') {
            "VERSION = `"$($Matches[1])`"" | Set-Content -Path "src\perfect_grid\_build_version.py"
          }
      - name: Install FFmpeg (real static binaries, not Chocolatey shims)
        shell: pwsh
        run: |
          # `choco install ffmpeg` only puts tiny *shim* launchers in
          # C:\ProgramData\chocolatey\bin — they redirect to the real exe
          # under chocolatey\lib at run time. Bundling the shim itself (as
          # this job used to do) ships a launcher that can't find its
          # target on an end user's machine: it fails, and because it's a
          # console-subsystem exe started from our windowed app, Windows
          # pops a console window for it first. Pull an actual static
          # build instead so what we bundle is self-contained.
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $binDir = Get-ChildItem -Path "ffmpeg_extracted" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "win-binaries" | Out-Null
          Copy-Item (Join-Path $binDir.FullName "bin\ffmpeg.exe") "win-binaries\ffmpeg.exe"
          Copy-Item (Join-Path $binDir.FullName "bin\ffprobe.exe") "win-binaries\ffprobe.exe"
      - name: Install Python deps
        run: pip install -r requirements.txt arabic-reshaper python-bidi
      - name: Build Windows app
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --windowed `
            --name "Perfect Grid" `
            --distpath "dist_windows" `
            --workpath "build_windows" `
            --icon "assets\icon.ico" `
            --paths "src" `
            --hidden-import "perfect_grid.engine" `
            --hidden-import "perfect_grid.pg_i18n" `
            --add-data "src\perfect_grid\presets_v2.json;." `
            --add-binary "win-binaries\ffmpeg.exe;." `
            --add-binary "win-binaries\ffprobe.exe;." `
            "src\perfect_grid\app.py"
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "dist_windows\Perfect Grid\*" -DestinationPath "PerfectGrid-${{ github.ref_name }}-Windows-x86_64.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-Windows
          path: PerfectGrid-${{ github.ref_name }}-Windows-x86_64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Write build version from tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "VERSION = \"${BASH_REMATCH[1]}\"" > src/perfect_grid/_build_version.py
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libxcb-xinerama0 libxcb-cursor0 \
            libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 fuse
      - name: Install Python dependencies
        run: pip install -r requirements.txt arabic-reshaper python-bidi
      - name: Build AppImage
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
          mv "Perfect-Grid-x86_64.AppImage" "PerfectGrid-${{ github.ref_name }}-Linux-x86_64.AppImage"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-Linux
          path: PerfectGrid-${{ github.ref_name }}-Linux-x86_64.AppImage

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Write build version from tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "VERSION = \"${BASH_REMATCH[1]}\"" > src/perfect_grid/_build_version.py
          fi
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt arabic-reshaper python-bidi
      - name: Build macOS app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Package macOS app
        run: |
          cd dist_mac
          ditto -c -k --keepParent "Perfect Grid.app" "../PerfectGrid-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-macOS-${{ matrix.arch }}
          path: PerfectGrid-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
