name: Build Perfect Grid

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "dist_windows\Perfect Grid\*" -DestinationPath "Perfect-Grid-Windows.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-Windows
          path: Perfect-Grid-Windows.zip

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build macOS app
        run: ./scripts/build_macos.sh
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "dist_mac/Perfect Grid.app" "Perfect-Grid-macOS.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect-Grid-macOS
          path: Perfect-Grid-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true

